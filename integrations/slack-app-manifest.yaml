# Slack app for the website assistant. Create it at https://api.slack.com/apps
# > Create New App > From a manifest > pick your workspace > paste this file.
display_information:
  name: Consult Assistant
  description: Posts new leads, booked calls and handovers from the website assistant.
  background_color: "#10282c"
features:
  bot_user:
    display_name: Consult Assistant
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # post messages
      - chat:write.public   # post to public channels without being invited first
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
