line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "S105", "S106", "S311"]

[lint.flake8-bugbear]
# FastAPI dependencies are declared as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[lint.per-file-ignores]
"tests/*" = ["S"]
"evals/*" = ["S"]
# Dashboard and privacy SQL is assembled only from constants in the file; every value is a $n parameter.
"app/admin/queries.py" = ["S608"]
"app/privacy/store.py" = ["S608"]
